<svg xmlns="http://www.w3.org/2000/svg" width="1056" height="710" viewBox="0 0 1056 710" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">CBM training regimes</title>
  <desc id="figure-description">Training graphs for a strict concept bottleneck model. Independent training fits the concept predictor on reviews and concept annotations; the task predictor is fit separately on annotated concepts and task labels. Sequential training fits the concept predictor first, then fixes it and trains the task predictor on predicted concepts. Joint training adds task loss and a weighted concept loss; task gradients reach both predictors. At inference all three use the same path: review to concept predictor to predicted concepts to task predictor. Source: https://proceedings.mlr.press/v119/koh20a.html</desc>
  <defs>
    <marker id="arrow-637784" markerUnits="userSpaceOnUse" viewBox="0 0 9 8" refX="8.5" refY="4" markerWidth="9" markerHeight="8" orient="auto"><path d="M0,0 9,4 0,8 Z" fill="#637784"/></marker>
    <marker id="arrow-285f8f" markerUnits="userSpaceOnUse" viewBox="0 0 9 8" refX="8.5" refY="4" markerWidth="9" markerHeight="8" orient="auto"><path d="M0,0 9,4 0,8 Z" fill="#285f8f"/></marker>
  </defs>
