<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="240" viewBox="0 0 1020 240" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">From a token to a code group</title>
  <desc id="figure-description">Brilliant after a missed train is assigned code 1. After a winning move it is assigned code 2. The bars beside each number show its codebook vector. Other words assigned to those codes are shown in context so readers can compare their meanings.</desc>
  <defs>
    <marker id="arrow-637784" markerUnits="userSpaceOnUse" viewBox="0 0 9 8" refX="8.5" refY="4" markerWidth="9" markerHeight="8" orient="auto"><path d="M0,0 9,4 0,8 Z" fill="#637784"/></marker>
    <marker id="arrow-18766f" markerUnits="userSpaceOnUse" viewBox="0 0 9 8" refX="8.5" refY="4" markerWidth="9" markerHeight="8" orient="auto"><path d="M0,0 9,4 0,8 Z" fill="#18766f"/></marker>
  </defs>
