<svg xmlns="http://www.w3.org/2000/svg" width="1084" height="388" viewBox="0 0 1084 388" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Single-layer VQ-VAE</title>
  <desc id="figure-description">For next, chess and match, the encoder transforms the token activations and the quantizer assigns the nearest codebook vector to each. For chess, the decoder receives the vector for code 3 and reconstructs the activation from the same language-model layer. Source: https://arxiv.org/abs/2602.02726v2</desc>
