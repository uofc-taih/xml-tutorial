<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="480" viewBox="0 0 1152 480" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Cross-layer VQ-VAE</title>
  <desc id="figure-description">The residual encoder mixes each lower-layer activation with a learned transformation. During training, the quantizer samples a code for each token from its top-k candidates. Decoder self-attention uses the sequence of codebook vectors, while cross-attention reads the continuous encoder outputs. The reconstruction is compared with the higher-layer activations of the same tokens. Adapted from Garg et al., Figure 1 and Section 2. Source: https://arxiv.org/html/2506.20040v4</desc>
